name: Publish PersonalOS Home
on:
  push:
    branches: [main]
    paths:
      - main.js
      - manifest.json
      - styles.css
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Obsidian plugin files
        id: check
        shell: bash
        run: |
          set -euo pipefail
          test -s manifest.json && test -s main.js && test -s styles.css
          node --check main.js
          node - <<'NODE'
          const fs = require("fs");
          const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          if(m.id !== "personalos-home" || m.isDesktopOnly !== false
             || !/^[0-9]+\.[0-9]+\.[0-9]+$/.test(m.version)) {
            throw new Error("Invalid plugin manifest / version");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + m.version + "\n");
          NODE
      - name: Publish release when version is new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Version already published. Increment manifest version for future updates."
            exit 0
          fi
          gh release create "$VERSION" manifest.json main.js styles.css \
            --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "PersonalOS Home version $VERSION for Obsidian desktop and mobile."
